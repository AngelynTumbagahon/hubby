<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer Wisely! ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef2;
            background-image: radial-gradient(#ffccd5 20%, transparent 20%);
            background-size: 20px 20px;
            overflow: hidden;
            text-align: center;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            background-color: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 360px;
            padding: 35px 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }
        .emoji-display {
            font-size: 70px;
            margin-bottom: 15px;
        }
        h1 {
            color: #d63384;
            font-size: 22px;
            margin: 0 0 10px 0;
            line-height: 1.4;
        }
        .warning-text {
            color: #dc3545;
            font-size: 16px;
            font-weight: bold;
            min-height: 24px;
            margin-bottom: 25px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            width: 100%;
            min-height: 120px;
        }
        button {
            width: 85%;
            padding: 14px 0;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            -webkit-tap-highlight-color: transparent;
        }
        #yesBtn {
            background-color: #e91e63;
            color: white;
        }
        #noBtn {
            background-color: #6c757d;
            color: white;
            z-index: 10;
        }
        /* Pop-up Envelope Styles */
        .envelope-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .arrow-down {
            font-size: 40px;
            color: #d63384;
            animation: bounceArrow 1s infinite;
            margin-bottom: 5px;
        }
        .instruction-tag {
            font-size: 18px;
            font-weight: bold;
            color: #d63384;
            margin-bottom: 15px;
        }
        .envelope-widget {
            cursor: pointer;
            background: white;
            padding: 20px;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(214, 51, 132, 0.3);
            font-size: 60px;
            transition: transform 0.2s;
        }
        .envelope-widget:active {
            transform: scale(0.9);
        }
        /* Kiss Stage Container */
        .kiss-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: popUp 0.5s ease-out;
        }
        #kissBtn {
            background-color: #ff4757;
            color: white;
            font-size: 24px;
            padding: 15px 40px;
            width: auto;
            margin-top: 15px;
        }
        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: popUp 0.3s ease-out;
        }
        .close-btn {
            background: #6c757d;
            color: white;
            padding: 10px 30px;
            font-size: 16px;
            border-radius: 20px;
            margin-top: 20px;
            width: auto;
        }
        .hidden { display: none !important; }
        @keyframes bounceArrow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes popUp {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- STAGE 1: The Question Box -->
    <div class="container" id="quizContainer">
        <div class="emoji-display" id="mainEmoji">🥺</div>
        <h1>Will you still be willing to be my boyfriend?</h1>
        <div class="warning-text" id="warningMessage"></div>
        <div class="buttons">
            <button id="yesBtn">YES</button>
            <button id="noBtn">NO</button>
        </div>
    </div>

    <!-- STAGE 2: Envelope Pop Up (Hidden initially) -->
    <div class="container hidden" id="envelopeStage">
        <div class="envelope-container">
            <div class="arrow-down">⬇️</div>
            <div class="instruction-tag">"click mo na to sige na"</div>
            <div class="envelope-widget" id="envelopeBtn">💌</div>
        </div>
    </div>

    <!-- STAGE 3: Kiss Request Box (Hidden initially) -->
    <div class="container hidden" id="kissStage">
        <div class="kiss-container">
            <div class="emoji-display">😘💋</div>
            <div class="instruction-tag" style="padding: 0 10px;">"click mo na kiss button bilisan mo para kiss na tayo"</div>
            <button id="kissBtn">MUAH! 💋</button>
        </div>
    </div>

    <!-- Message Letter Modal Display Window -->
    <div class="modal" id="letterModal">
        <div class="modal-content">
            <div style="font-size: 50px; margin-bottom: 10px;">💖</div>
            <h3 style="color: #d63384; margin: 0 0 10px 0;">Buti naman, sa tingin mo may choice ka? 😂❤️</h3>
            <p style="color: #555; line-height: 1.6; font-size: 18px; margin: 0;">
                Happy Monthsary! <br> I love you so much! 💌✨
            </p>
            <button class="close-btn" id="closeModal">Next 👉</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
