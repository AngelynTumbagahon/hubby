<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer Wisely! ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef2;
            background-image: radial-gradient(#ffccd5 20%, transparent 20%);
            background-size: 20px 20px;
            overflow: hidden;
            text-align: center;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            background-color: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 360px;
            padding: 35px 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 420px;
            position: relative;
        }
        .emoji-display {
            font-size: 75px;
            margin-bottom: 15px;
            line-height: 1;
            user-select: none;
        }
        .heart-animation {
            animation: pulse 0.8s infinite alternate ease-in-out;
        }
        .shock-animation {
            animation: shake 0.15s infinite alternate ease-in-out;
        }
        h1 {
            color: #d63384;
            font-size: 24px;
            margin: 0 0 20px 0;
            line-height: 1.4;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            width: 100%;
        }
        button {
            width: 85%;
            padding: 14px 0;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #yesBtn {
            background-color: #e91e63;
            color: white;
            z-index: 5;
        }
        #noBtn {
            background-color: #6c757d;
            color: white;
            z-index: 2;
        }
        /* Heart Icon Widget Styles */
        .heart-widget {
            cursor: pointer;
            background: white;
            padding: 20px;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(214, 51, 132, 0.3);
            font-size: 65px;
            transition: transform 0.2s;
            line-height: 1;
            margin-top: 15px;
        }
        .heart-widget:active {
            transform: scale(0.9);
        }
        /* Generic utility styles */
        .action-text {
            font-size: 18px;
            font-weight: bold;
            color: #d63384;
            margin-bottom: 10px;
        }
        .hidden { display: none !important; }
        
        /* Keyframes */
        @keyframes popUp {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pulse {
            to { transform: scale(1.15); }
        }
        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            100% { transform: translate(-2px, -1px) rotate(-2deg); }
        }
    </style>
</head>
<body>

    <!-- STAGE 1: Pleading Sad Face Question Box -->
    <div class="container" id="stage1">
        <div class="emoji-display heart-animation" id="mainEmoji">🥺💔</div>
        <h1>Do you love me?</h1>
        <div class="buttons">
            <button id="yesBtn">YES</button>
            <button id="noBtn">NO</button>
        </div>
    </div>

    <!-- STAGE 2: Ahhhh You Love Me Prompt -->
    <div class="container hidden" id="stage2">
        <div class="emoji-display shock-animation">😳✨</div>
        <h1 style="font-size: 20px; padding: 0 5px;">ahhhhhhhhhhhhhhhhhhhhh you love me??????</h1>
        <button id="repeatBtn" style="background-color: #e91e63; color: white; width: auto; padding: 12px 35px; margin-top: 15px;">ulitin mo aba 👉</button>
    </div>

    <!-- STAGE 3: Click Heart Icon Stage -->
    <div class="container hidden" id="stage3">
        <div class="action-text">"click heart icon"</div>
        <div class="heart-widget heart-animation" id="heartBtn">❤️</div>
    </div>

    <!-- STAGE 4: Final Love Declaration -->
    <div class="container hidden" id="stage4">
        <div class="emoji-display heart-animation">🥰🎉</div>
        <h1 style="font-size: 18px; color: #e91e63; padding: 0 5px; word-break: break-word;">
            ahhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh you love me nganiiiiiiiii
        </h1>
    </div>

    <script src="script.js"></script>
</body>
</html>
