<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer Wisely! ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* UPDATED COLOR PALETTE: Deep Crimson-Magenta Romantic Palette */
            background-color: #7a0c32;
            background-image: radial-gradient(#9c1445 20%, transparent 20%);
            background-size: 25px 25px;
            overflow: hidden;
            text-align: center;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            border: 3px solid #ff2a75;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 360px;
            padding: 35px 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 440px;
            position: relative;
        }
        .gif-display {
            width: 160px;
            height: 160px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 16px;
        }
        h1 {
            color: #9c1445;
            font-size: 24px;
            margin: 0 0 20px 0;
            line-height: 1.4;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            width: 100%;
        }
        button {
            width: 85%;
            padding: 14px 0;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #yesBtn {
            background-color: #ff2a75;
            color: white;
            z-index: 5;
        }
        #noBtn {
            background-color: #4a5568;
            color: white;
            z-index: 2;
        }
        /* Pulse Heart Graphic Asset Styles */
        .heart-widget {
            cursor: pointer;
            background: white;
            padding: 20px;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(255, 42, 117, 0.4);
            font-size: 65px;
            transition: transform 0.2s;
            line-height: 1;
            margin-top: 15px;
            animation: pulse 0.8s infinite alternate ease-in-out;
        }
        .heart-widget:active {
            transform: scale(0.9);
        }
        .action-text {
            font-size: 20px;
            font-weight: bold;
            color: #ff2a75;
            margin-bottom: 10px;
        }
        .hidden { display: none !important; }
        
        /* Interactive Animation Timelines */
        @keyframes pulse {
            to { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <!-- STAGE 1: Pleading Sad Bear GIF Question Box -->
    <div class="container" id="stage1">
        <!-- FIXED ACTIVE LINK: Sad crying pleading bear -->
        <img src="https://moeyy.xyz" class="gif-display" alt="Sad bear pleading">
        <h1>Do you love me?</h1>
        <div class="buttons">
            <button id="yesBtn">YES</button>
            <button id="noBtn">NO</button>
        </div>
    </div>

    <!-- STAGE 2: Ahhhh You Love Me Shocked GIF Prompt -->
    <div class="container hidden" id="stage2">
        <!-- FIXED ACTIVE LINK: Shocked excited dancing bear -->
        <img src="https://moeyy.xyz" class="gif-display" alt="Shocked happy bear">
        <h1 style="font-size: 20px; padding: 0 5px; color: #ff2a75;">ahhhhhhhhhhhhhhhhhhhhh you love me??????</h1>
        <button id="repeatBtn" style="background-color: #ff2a75; color: white; width: auto; padding: 12px 35px; margin-top: 15px;">ulitin mo aba 👉</button>
    </div>

    <!-- STAGE 3: Click Heart Icon Stage -->
    <div class="container hidden" id="stage3">
        <div class="action-text">"click heart icon"</div>
        <div class="heart-widget" id="heartBtn">❤️</div>
    </div>

    <!-- STAGE 4: Final Love Declaration Celebration GIF -->
    <div class="container hidden" id="stage4">
        <!-- FIXED ACTIVE LINK: Ultimate happy sweet couple head kisses -->
        <img src="https://moeyy.xyz" class="gif-display" alt="Sweet bear kisses">
        <h1 style="font-size: 18px; color: #ff2a75; padding: 0 5px; word-break: break-word;">
            ahhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh you love me nganiiiiiiiii
        </h1>
    </div>

    <script src="script.js"></script>
</body>
</html>
