<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕹️ ARCADE CAMPAIGN: TRUE LOVE v5.5 🕹️</title>
    <style>
        :root {
            --bg-dark: #06010f;
            --bg-grid: rgba(0, 243, 255, 0.03);
            --neon-pink: #ff2a75;
            --neon-cyan: #00f3ff;
            --neon-yellow: #fff200;
            --text-light: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(0, 243, 255, 0.25);
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at center, #1b0222, var(--bg-dark));
            background-image: linear-gradient(var(--bg-grid) 2px, transparent 2px),
                              linear-gradient(90deg, var(--bg-grid) 2px, transparent 2px);
            background-size: 25px 25px;
            overflow: hidden;
            text-align: center;
            padding: 16px;
            box-sizing: border-box;
        }

        /* Top HUD performance panel dashboard */
        .hud-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            background: rgba(0, 5, 15, 0.85);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px 18px;
            box-sizing: border-box;
            margin-bottom: 12px;
            color: var(--text-light);
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 500px;
            position: relative;
            z-index: 1;
        }

        /* Playable Marine Environment Grid Box */
        .sea-arena {
            position: relative;
            width: 100%;
            height: 240px;
            background: radial-gradient(circle at center, #072a4d, #021124);
            border: 2px dashed var(--neon-cyan);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
            /* Custom Net Cursor Mask */
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='40' height='40' style='font-size:28px'><text y='30'>🕸️</text></svg>"), auto;
        }

        .spawn-item {
            position: absolute;
            font-size: 38px;
            cursor: pointer;
            user-select: none;
            line-height: 1;
            z-index: 5;
            transition: left 0.3s linear, top 0.3s linear;
        }

        .game-sprite {
            font-size: 85px;
            margin-bottom: 15px;
            line-height: 1;
            user-select: none;
            filter: drop-shadow(0 0 15px var(--neon-pink));
        }

        .pulse { animation: softPulse 0.6s infinite alternate ease-in-out; }
        .shake { animation: retroShake 0.1s infinite alternate; }

        h1 {
            color: var(--text-light);
            font-size: 24px;
            font-weight: 900;
            margin: 0 0 15px 0;
            line-height: 1.4;
            letter-spacing: -0.5px;
            transition: font-size 0.2s ease;
        }

        .log-ticker {
            color: var(--neon-cyan);
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            min-height: 48px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
            line-height: 1.4;
        }

        /* Calibration Petting Meter Elements */
        .meter-container {
            width: 85%;
            height: 20px;
            background: #111;
            border: 2px solid var(--neon-cyan);
            border-radius: 10px;
            position: relative;
            margin: 15px 0;
            overflow: hidden;
        }

        .meter-target {
            position: absolute;
            width: 20%;
            height: 100%;
            background: var(--neon-pink);
            left: 40%;
        }

        .meter-pointer {
            position: absolute;
            width: 6px;
            height: 100%;
            background: var(--neon-yellow);
            left: 0%;
            box-shadow: 0 0 8px #fff;
        }

        /* Cow satisfaction satisfaction tracker bar */
        .satisfuse-wrapper {
            width: 85%;
            height: 14px;
            background: #222;
            border-radius: 6px;
            border: 1px solid #444;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .satisfuse-inner {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00f3ff, #ff2a75);
            transition: width 0.2s ease;
        }

        .control-pad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            position: relative;
        }

        button {
            width: 85%;
            padding: 15px 0;
            font-size: 18px;
            font-weight: 900;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            -webkit-tap-highlight-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--neon-pink), #ff5e97);
            color: white;
            transition: transform 0.1s, background 0.2s, font-size 0.2s;
        }
        button:active { transform: scale(0.96); }

        #noBtn {
            background: #1c142c;
            border: 1px solid #3d2b52;
            color: #796194;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hidden { display: none !important; }

        @keyframes softPulse { to { transform: scale(1.1); } }
        @keyframes retroShake {
            0% { transform: translate(2px, 2px); }
            100% { transform: translate(-2px, -2px); }
        }
    </style>
</head>
<body>

    <!-- HUD ADVENTURE PORTAL STATUS PANEL -->
    <div class="hud-panel hidden" id="hudPanel">
        <div>QUEST LEVEL: <span id="hudLevel" style="color: var(--neon-cyan);">1 / 3</span></div>
        <div>TIME LEFT: <span id="hudClock" style="color: var(--neon-pink);">15s</span></div>
        <div>LOVE METER: <span id="hudScore" style="color: var(--neon-yellow);">0 worth</span></div>
    </div>

    <!-- MAIN GAME CABINET WRAPPER -->
    <div class="container" id="gameCabinet">
        <div class="game-sprite pulse" id="gameAsset">🥺🌊</div>
        <h1 id="gameHeader">Love mo padin ako?</h1>
        <div class="log-ticker" id="gameLog">> DEEP SEA SECURITY CHECK ACTIVE...</div>
        
        <div class="sea-arena hidden" id="seaArena"></div>

        <div class="control-pad" id="gameControls">
            <button id="yesBtn">YES ❤️</button>
            <button id="noBtn">NO</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
