<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer Wisely! ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef2;
            background-image: radial-gradient(#ffccd5 20%, transparent 20%);
            background-size: 20px 20px;
            overflow: hidden;
            text-align: center;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            background-color: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 360px;
            padding: 35px 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            transition: all 0.3s ease;
        }
        .emoji-display {
            font-size: 70px;
            margin-bottom: 15px;
            transition: transform 0.2s ease;
        }
        h1 {
            color: #d63384;
            font-size: 22px;
            margin: 0 0 10px 0;
            line-height: 1.4;
        }
        .warning-text {
            color: #dc3545;
            font-size: 16px;
            font-weight: bold;
            min-height: 24px;
            margin-bottom: 25px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            width: 100%;
            min-height: 120px;
        }
        button {
            width: 85%;
            padding: 14px 0;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        #yesBtn {
            background-color: #e91e63;
            color: white;
        }
        #noBtn {
            background-color: #6c757d;
            color: white;
            z-index: 10;
        }
        /* Floating Envelope Component */
        .envelope-widget {
            position: fixed;
            bottom: 25px;
            right: 25px;
            cursor: pointer;
            z-index: 100;
            background: white;
            padding: 12px;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.2);
            font-size: 30px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        /* Letter Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: popUp 0.3s ease-out;
        }
        .close-btn {
            background: #6c757d;
            color: white;
            padding: 8px 20px;
            font-size: 14px;
            border-radius: 20px;
            margin-top: 20px;
            width: auto;
        }
        .hidden { display: none !important; }
        .success-message {
            color: #d63384;
            font-size: 24px;
            font-weight: bold;
            line-height: 1.4;
        }
        @keyframes popUp {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Main Card Box -->
    <div class="container" id="quizContainer">
        <div class="emoji-display" id="mainEmoji">🥺</div>
        <h1>Do you still want to be my boyfriend?</h1>
        <div class="warning-text" id="warningMessage"></div>
        <div class="buttons">
            <button id="yesBtn">YES</button>
            <button id="noBtn">NO</button>
        </div>
    </div>

    <!-- Success Message Box -->
    <div class="container hidden" id="successContainer">
        <div class="emoji-display">😎👊</div>
        <div class="success-message">
            Buti naman, sa tingin mo may choice ka nang gigigil ako sayo 😂❤️
        </div>
    </div>

    <!-- Floating Envelope -->
    <div class="envelope-widget" id="envelopeBtn">💌</div>

    <!-- Hidden Letter Modal -->
    <div class="modal" id="letterModal">
        <div class="modal-content">
            <div style="font-size: 40px; margin-bottom: 10px;">💖</div>
            <h3 style="color: #d63384; margin: 0 0 10px 0;">To My Favorite Person</h3>
            <p style="color: #555; line-height: 1.5; margin: 0;">Happy Monthsary! <br> I love you so much my love! 💌✨</p>
            <button class="close-btn" id="closeModal">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
